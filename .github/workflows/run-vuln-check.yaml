name: security
on:
  push:
    branches: [ "main" ]
  pull_request:
permissions:
  contents: read
jobs:
  govuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - name: vulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

          # Suppressed vulnerability IDs (Go vuln DB open-ended range; no fixed version available
          # via a dependency upgrade that preserves build compatibility):
          #
          # GO-2026-6568: github.com/gardener/gardener — Authorization Bypass via Group Subject
          #               Injection. Patched upstream in v1.142.6/v1.143.3/v1.144.2/v1.145.0,
          #               but the Go vuln DB entry still carries an open-ended {introduced:0}
          #               range with no fixed event, so govulncheck reports "Fixed in: N/A"
          #               regardless of the gardener version in use. Upgrading gardener to
          #               v1.142.6+ requires upstream changes in
          #               github.com/kyma-project/infrastructure-manager (tracked in
          #               https://github.com/kyma-project/kyma-infrastructure-manager/pull/1594).
          #               Remove this suppression once that PR merges and infrastructure-manager
          #               is upgraded here.
          SUPPRESSED="GO-2026-6568"

          OUTPUT=$(govulncheck -format json ./... 2>&1) || true

          echo "$OUTPUT" | python3 -I -c "
          import json, sys
          suppressed = set('$SUPPRESSED'.split())
          found = []
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              try:
                  msg = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(msg, dict):
                  continue
              finding = msg.get('finding')
              if not isinstance(finding, dict):
                  continue
              if finding.get('osv', '') not in suppressed:
                  found.append(finding)
          if found:
              print('Unsuppressed vulnerabilities found:')
              for f in found:
                  print(f'  {f[\"osv\"]}: fixed in {f.get(\"fixed_version\", \"N/A\")}')
              sys.exit(1)
          else:
              print('No unsuppressed vulnerabilities found.')
          "
